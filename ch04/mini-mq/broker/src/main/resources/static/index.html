<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mini-mq</title>
<style>
  :root {
    --bg: #faf7f2; --card: #ffffff; --ink: #2b2620; --muted: #8a8177; --line: #e6dfd5;
    --accent: #b5452f; --ok: #3f7d4e; --warn: #c07a12; --bad: #b3261e;
    --data: #c99a1e; --ctrl: #1f8fa3;
    --b1: #2f6db5; --b2: #3f7d4e; --b3: #8a4fb0;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1d1a17; --card: #26221e; --ink: #ece6dd; --muted: #a39a8f; --line: #3a342e;
            --accent: #e0664d; --ok: #6bbf7f; --warn: #e2a33d; --bad: #f2776d;
            --data: #e2b545; --ctrl: #3fb6cb;
            --b1: #6ea4e6; --b2: #6bbf7f; --b3: #c08be0; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif; }
  header { padding: 10px 20px; border-bottom: 1px solid var(--line); display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  h1 { font-size: 17px; margin: 0; }
  .muted { color: var(--muted); font-size: 13px; }
  main { padding: 12px 20px 30px; display: grid; gap: 16px; max-width: 1280px; }
  h2 { font-size: 13px; margin: 0 0 6px; color: var(--muted); font-weight: 600; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .tools { display: flex; gap: 18px; flex-wrap: wrap; align-items: center; }
  .tool { display: flex; gap: 6px; align-items: center; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; }
  button { font: inherit; font-size: 12px; padding: 2px 9px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.send { background: var(--data); border-color: var(--data); color: #fff; font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  .sendbar { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; font-size: 13px; margin-bottom: 6px; }
  .sendbar .grp { display: flex; gap: 4px; align-items: center; }
  #banner:empty { display: none; }
  #banner { background: var(--card); border: 2px solid var(--line); border-radius: 8px; margin: 2px 0 6px; padding: 5px 10px;
            font-size: 13px; line-height: 1.45; min-height: 34px; }
  .tabs { display: flex; gap: 6px; margin: -2px 0 10px; border-bottom: 1px solid var(--line); }
  .tabs button { border: 0; border-bottom: 3px solid transparent; border-radius: 0; background: none; padding: 6px 12px; font-size: 13.5px; font-weight: 600; }
  .tabs button.active { border-bottom-color: var(--accent); color: var(--accent); }
  .tabs button .muted { font-weight: 400; font-size: 12px; }
  .full-only { }
  body[data-view="simple"] .full-only { display: none; }
  .flowwrap { position: relative; }
  svg { width: 100%; height: auto; display: block; }
  svg text { font-family: inherit; }
  svg text:not([fill]) { fill: var(--ink); } /* fill 을 준 글자는 그 색으로 (예전엔 이 규칙이 덮어써 모두 검정이었다) */
  #overlay { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 6px; }
  .legend i { display: inline-block; width: 22px; height: 0; border-top: 3px solid; vertical-align: middle; margin-right: 4px; }
  @keyframes flow { to { stroke-dashoffset: -28; } }
  .anim { animation: flow linear infinite; }
  .kind { font-size: 11px; font-weight: 700; padding: 0 6px; border-radius: 8px; color: #fff; margin-right: 4px; white-space: nowrap; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--line); font-size: 13px; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  td.num, th.num { text-align: right; }
  .events td:first-child { white-space: nowrap; color: var(--muted); width: 1%; }
  .trace td { vertical-align: top; }
  .trace td:first-child { white-space: nowrap; color: var(--muted); width: 1%; text-align: right; }
  .trace tr.future { opacity: .3; }
  .trace tr.cur td { font-weight: 700; }
  .trace .wait td { color: var(--muted); font-style: italic; }
  .tctl { display: inline-flex; gap: 6px; margin-left: 10px; vertical-align: middle; font-weight: 400; }
  .tctl select { font: inherit; font-size: 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  details summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  .bad { color: var(--bad); font-weight: 600; }
  .two { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  @media (max-width: 900px) { .two { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>mini-mq</h1>
  <div class="tools" id="tools"></div>
  <span class="muted" id="updated"></span>
</header>
<main>
  <section class="card">
    <div class="tabs" id="tabs">
      <button data-view="simple" onclick="setView('simple')">① 기본 흐름</button>
      <button data-view="full" onclick="setView('full')">② 브로커 · 복제</button>
    </div>
    <div class="sendbar" id="sendbar"></div>
    <div id="banner"></div>
    <div class="flowwrap">
      <svg id="flow" viewBox="0 0 1160 600" role="img" aria-label="생산자 → 브로커(파티션 사본) → 소비자 그룹"></svg>
      <svg id="overlay" viewBox="0 0 1160 600" aria-hidden="true"></svg>
    </div>
    <div class="legend">
      <span><i style="border-color:var(--data)"></i>데이터: 메시지가 움직임 (생산 · <span class="full-only">복제 · </span>소비). 소비는 소비자가 ⇠ fetch 로 가져감</span>
      <span><i style="border-color:var(--ctrl);border-top-style:dashed"></i>컨트롤: 일어날 때만 그림</span>
      <span class="full-only">사본 줄: <b>★</b> 리더 · 실선 ISR · 점선 ISR 밖 · 같은 색 = 같은 파티션</span>
    </div>
  </section>

  <div class="two">
    <section>
      <h2>⏪ 천천히 보기 <span class="muted" id="trTitle"></span>
        <span class="tctl">
          <button onclick="startReplay()" title="기록된 단계를 처음부터 천천히 다시 보여 준다">▶ 다시 재생</button>
          <button onclick="pauseReplay()">⏸</button>
          <button onclick="nextStep()" title="한 단계씩">⏭ 다음</button>
          <button onclick="stopReplay()" title="재생을 그만두고 전부 보기">■</button>
          <select id="stepMs" onchange="replay.stepMs = Number(this.value)" title="단계 사이 간격">
            <option value="4500">느리게</option><option value="3000" selected>보통</option><option value="1600">빠르게</option></select>
        </span></h2>
      <div class="card"><table class="trace"><tbody id="trace"><tr class="wait"><td></td><td>아직 보낸 메시지가 없다.</td></tr></tbody></table></div>
      <h2 style="margin-top:14px">이벤트</h2>
      <div class="card"><table class="events"><tbody id="events"></tbody></table></div>
    </section>
    <section>
      <details>
        <summary>자세히: 파티션 · 소비자 그룹 숫자</summary>
        <div class="card" style="margin-top:6px"><table>
          <thead><tr><th>파티션</th><th>리더</th><th>ISR</th><th class="num">LEO</th><th class="num">HW</th></tr></thead>
          <tbody id="ptable"></tbody></table></div>
        <div class="card" style="margin-top:8px"><table>
          <thead><tr><th>그룹</th><th>토픽</th><th class="num">lag 합</th><th>파티션별</th></tr></thead>
          <tbody id="gtable"></tbody></table></div>
      </details>
    </section>
  </div>
</main>
<script>
// ------------------------------------------------------------------ 공통
const C = id => id > 0 ? `var(--b${((id - 1) % 3) + 1})` : 'var(--muted)';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const time = ms => new Date(ms).toLocaleTimeString([], {hour12: false});
const width = r => 1.2 + 2.4 * Math.log10(1 + r);
const anim = (r) => {
  if (!r) return '';
  const dur = Math.max(0.35, 2.4 - 0.75 * Math.log10(1 + r));
  return `class="anim" style="animation-duration:${dur}s;animation-delay:-${(Date.now() / 1000) % dur}s"`;
};
// 선 위 이름표: 경로 "M x,y C x1,y1 x2,y2 x,y" 의 t 지점에 메시지 이름 (예: GET /fetch, POST /offsets)
const bez = (d, t = 0.5) => {
  const n = (d.match(/-?[\d.]+/g) || []).map(Number);
  if (n.length < 8) return null;
  const [x0, y0, x1, y1, x2, y2, x3, y3] = n, u = 1 - t;
  const f = (a, b, c, e) => u * u * u * a + 3 * u * u * t * b + 3 * u * t * t * c + t * t * t * e;
  return [f(x0, x1, x2, x3), f(y0, y1, y2, y3)];
};
const tagW = text => 12 + [...text].reduce((a, c) => a + (c.codePointAt(0) > 0x2e80 ? 11 : 6.3), 0);
const tag = (x, y, text, color) => `<g><rect x="${x - tagW(text) / 2}" y="${y - 9}" width="${tagW(text)}" height="17" rx="8.5" fill="var(--card)" stroke="${color}" stroke-width="1.2"/>
  <text x="${x}" y="${y + 3.5}" text-anchor="middle" font-size="10.5" font-weight="700" fill="${color}">${esc(text)}</text></g>`;
const edgeTag = (d, text, color, t = 0.5) => { const p = bez(d, t); return p ? tag(p[0], p[1], text, color) : ''; };
const curve = (x1, y1, x2, y2) => { const dx = (x2 - x1) * 0.5; return `M${x1},${y1} C${x1 + dx},${y1} ${x2 - dx},${y2} ${x2},${y2}`; };
// 같은 파티션의 사본은 같은 색 (토픽마다 색 계열을 달리)
const PART_HUE = {logs: [28, 52, 4, 145, 205], orders: [200, 170, 232]};
const partColor = (topic, p) => { const h = PART_HUE[topic] || [280, 310, 250]; return `hsl(${h[p % h.length] + 40 * Math.floor(p / h.length)} 62% 48%)`; };

// 데이터 = 메시지 자체가 움직이는 단계, 컨트롤 = 지도·HW·ACK·오프셋 커밋처럼 메시지에 관한 정보·응답이 오가는 단계
const STEP_KIND = {map: 'ctrl', buffered: 'data', dispatched: 'data', stored: 'data', replicated: 'data', hw: 'ctrl', acked: 'ctrl', fetched: 'data', committed: 'ctrl', failed: 'ctrl'};
const STEP_ICON = {map: '🗺', buffered: '🧺', dispatched: '🧭', stored: '💾', replicated: '📋', hw: '✅', acked: '📬', fetched: '📥', committed: '📌', failed: '❌'};
const kindTag = k => `<span class="kind" style="background:var(--${k})">${k === 'data' ? '데이터' : '컨트롤'}</span>`;

let SEG = {};
let VIEW = (() => { try { return localStorage.getItem('minimq.view') || 'simple'; } catch (e) { return 'simple'; } })();
function setView(v) {
  VIEW = v;
  try { localStorage.setItem('minimq.view', v); } catch (e) { /* 저장 못 해도 된다 */ }
  document.body.dataset.view = v;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('active', b.dataset.view === v));
  if (replay.on && replay.mode === 'election') stopReplay(); // 상자 위치가 달라지므로 선거 재생은 멈춘다
  document.getElementById('overlay').innerHTML = '';
  if (lastState) draw(lastState);
}
let lastState = null;
const replay = {on: false, k: 0, playing: false, timer: null, stepMs: 3000, mode: 'trace', steps: [], election: null};
let currentTrace = new URLSearchParams(location.search).get('trace');

// ------------------------------------------------------------------ 버튼
async function act(action, id, value) {
  await fetch(`/admin/cluster/${action}?id=${id}` + (value !== undefined ? `&value=${value}` : ''), {method: 'POST'}).catch(() => {});
  setTimeout(refresh, 300);
}

async function sendFrom(name, count) {
  try {
    const r = await (await fetch(`/admin/producers/${encodeURIComponent(name)}/send?count=${count}`, {method: 'POST'})).json();
    if (r.ids && r.ids.length) {
      currentTrace = r.ids[r.ids.length - 1]; // 마지막 한 건을 따라간다
      stopReplay();
      await refresh();
      setTimeout(() => startReplay('trace'), 300);
    }
  } catch (e) { banner(null, `${name} 에 보내기 실패`, 'ctrl'); }
}

async function resetProducer(name) {
  await fetch(`/admin/producers/${encodeURIComponent(name)}/reset`, {method: 'POST'}).catch(() => {});
  stopReplay(); currentTrace = null; // 지난 추적도 지운다
  refresh();
}
async function flushFrom(name) {
  await fetch(`/admin/producers/${encodeURIComponent(name)}/flush`, {method: 'POST'}).catch(() => {});
  refresh();
}

function tools(nodes) {
  document.getElementById('tools').innerHTML = nodes.map(n => {
    const d = n.replicationDelayMs || 0, iso = n.reachable && n.coord.isolated;
    return `<span class="tool"><span class="dot" style="background:${C(n.id)}"></span>broker-${n.id}
      <button class="${iso ? 'on' : ''}" ${n.reachable ? '' : 'disabled'} onclick="act('isolate',${n.id},${!iso})" title="네트워크에서 떼어 낸다">고립</button>
      <button class="${d ? 'on' : ''}" ${n.reachable ? '' : 'disabled'} onclick="act('slow',${n.id},${({0: 2000, 2000: 6000})[d] ?? 0})"
        title="팔로워로서 가져가기 전에 쉰다: 끔 → 2초(ISR 안에서 뒤처짐) → 6초(ISR 에서 빠짐) → 끔">느린 복제${d ? ' ' + d / 1000 + '초' : ''}</button>
      <button ${n.reachable ? '' : 'disabled'} onclick="act('crash',${n.id})" title="프로세스를 죽이고 15초 뒤 다시 띄운다">강제 종료</button></span>`;
  }).join('');
}

function sendbar(s) {
  const el = document.getElementById('sendbar');
  const html = (s.producers || []).map(p => `<span class="grp">📨 <b>${esc(p.name)}</b> → ${esc(p.topic || '?')} (acks=${esc(p.acks || '?')})
      <button class="send" ${p.reachable && p.ready ? '' : 'disabled'} onclick="sendFrom('${esc(p.name)}', 1)">1건</button>
      <button class="send" ${p.reachable && p.ready ? '' : 'disabled'} onclick="sendFrom('${esc(p.name)}', 5)">5건</button>
      <button ${p.reachable && p.ready ? '' : 'disabled'} onclick="flushFrom('${esc(p.name)}')" title="덜 찬 묶음도 지금 리더에게 보낸다">지금 보내기</button>
      <button ${p.reachable && p.ready ? '' : 'disabled'} onclick="resetProducer('${esc(p.name)}')" title="생산자를 켜진 직후로: 지도(라우팅)와 버퍼를 비운다">초기화</button></span>`).join('');
  const el2 = lastElection(s);
  const elect = `<span class="grp">👑 컨트롤러 선출 ${el2 ? `<span class="muted">최근: broker-${el2.E.node} (${time(el2.E.at)})</span>` : ''}
      <button class="send" style="background:var(--ctrl);border-color:var(--ctrl)" ${el2 ? '' : 'disabled'} onclick="startReplay('election')">선출 과정 보기</button></span>`;
  const all = elect + html; // 선출이 먼저 일어나고(컨트롤러가 지도를 그림) 그 다음에 메시지를 보낸다
  if (el.dataset.html !== all) { el.innerHTML = all; el.dataset.html = all; }
}

// ------------------------------------------------------------------ 한 건 추적
function traceOf(s) {
  if (!currentTrace || !s) return null;
  const up = s.nodes.filter(n => n.reachable);
  const t = up.flatMap(n => (n.trace || {}).traces || []).find(x => x.id === currentTrace);
  const events = up.flatMap(n => ((n.trace || {}).events || []).filter(e => e.trace === currentTrace))
    .sort((a, b) => a.at - b.at || (a.broker === b.broker ? a.seq - b.seq : 0));
  const seen = new Set();
  const all = events.filter(e => { const k = e.step + '|' + e.who; if (seen.has(k)) return false; seen.add(k); return true; });
  const done = all.some(e => e.step === 'committed' || e.step === 'failed')
    || (all.length && all.at(-1).step !== 'buffered' && Date.now() - all.at(-1).at > 30000);
  return {id: currentTrace, t, all, events: all, done, key: t ? `${t.topic}-${t.partition}` : null,
    has: (step, who) => all.some(e => e.step === step && (who === undefined || e.who === who))};
}
function visibleTrace(tr) {
  if (!tr || !replay.on || replay.mode !== 'trace') return tr;
  const ev = tr.all.slice(0, replay.k);
  return {...tr, events: ev, has: (step, who) => ev.some(e => e.step === step && (who === undefined || e.who === who))};
}

// ------------------------------------------------------------------ 천천히 재생 (한 건 또는 선거)
// mode = 'trace': 메시지 한 건의 기록 / 'election': 가장 최근 컨트롤러 선출의 Raft 이벤트
let GEO = null; // 마지막으로 그린 브로커 상자 위치

function steps() { return replay.mode === 'election' ? replay.steps : (traceOf(lastState) || {all: []}).all; }
function startReplay(mode) {
  if (mode) replay.mode = mode;
  if (!lastState) return;
  if (replay.mode === 'election') {
    // 지금 보고 있는 탭에서 재생한다 (① 에도 브로커·조정 서비스 상자가 있다)
    const el = lastElection(lastState);
    if (!el) { banner(null, '아직 기록된 선거가 없다 (조정 서비스는 최근 120개 기록만 남긴다)', 'ctrl'); return; }
    replay.steps = el.steps; replay.election = el;
  } else if (!traceOf(lastState)) return;
  pauseReplay();
  replay.on = true; replay.k = 0; replay.playing = true;
  stepNext();
}
function pauseReplay() { replay.playing = false; clearTimeout(replay.timer); }
function nextStep() { pauseReplay(); if (!replay.on) { startReplay(); pauseReplay(); return; } stepNext(true); }
function stopReplay() {
  pauseReplay(); replay.on = false;
  document.getElementById('overlay').innerHTML = '';
  if (lastState) { draw(lastState); traceView(lastState, traceOf(lastState)); }
}
function stepNext(manual) {
  const list = steps();
  if (replay.k >= list.length) {
    if (replay.mode === 'election') {
      replay.playing = false;
      const E = replay.election.E;
      const core = list.filter(e => !e.kind.startsWith('route'));
      banner(null, `끝: broker-${E.node} 가 컨트롤러가 됐다 (zxid ${E.term}). 선출 ${core.length}단계, 실제로는 ${core.at(-1).at - core[0].at}ms`, 'ctrl');
      return;
    }
    const tr = traceOf(lastState);
    if (tr && tr.done) { replay.playing = false; banner(null, `끝: ${list.length}단계, 실제로는 ${list.at(-1).at - list[0].at}ms 걸렸다`, 'data'); return; }
    const last = list.at(-1);
    if (last && last.step === 'buffered') banner(null, '⏳ 생산자 버퍼에서 기다리는 중: 같은 파티션 묶음이 5건이 차면 보낸다 (지금 보내려면 "지금 보내기")', 'data');
    if (replay.playing || manual) replay.timer = setTimeout(() => stepNext(manual), 400);
    return;
  }
  const e = list[replay.k++];
  draw(lastState); traceView(lastState, traceOf(lastState));
  if (replay.mode === 'election') playElection(e, list[0].at); else playStep(e, list[0].at);
  if (replay.playing) replay.timer = setTimeout(stepNext, replay.stepMs);
}
function banner(e, text, kind, t0) {
  const b = document.getElementById('banner');
  b.style.borderColor = `var(--${kind})`;
  if (!e) { b.innerHTML = esc(text); return; }
  if (replay.mode === 'election') {
    b.innerHTML = (e.kind === 'seen' || e.kind === 'applied')
      ? `${kindTag('ctrl')} <b>${replay.k}.</b> ${ZK_ICON[e.kind]} ${esc(e.text)} <span class="muted">(실제 +${e.at - t0}ms)</span>`
      : e.kind.startsWith('route')
      ? `${kindTag('ctrl')} <b>${replay.k}.</b> 🗺 ${esc(e.text)}${e.data ? ` <code>${esc(e.data)}</code>` : ''} <span class="muted">(실제 +${e.at - t0}ms)</span>`

      <text x="${lx + 24}" y="${ly + 51}" font-size="11" font-family="ui-monospace,monospace">${esc(line3)}</text>`;
    return moveDot(base + label, `M${sx},${sy} C${sx},${sy - 60} ${bx - 70},${by} ${bx},${by}`, 'var(--ctrl)', '6 5', {pingpong: true, backColor: 'var(--ok)', label: 'GET /metadata', backLabel: '지도'});
  }
  if (e.kind === 'route_none' && rp) return pulse(base, rp[0], rp[1], 'var(--warn)');
  const [x, y] = zkPt();
  pulse(base, x - 30, y, e.kind === 'deleted' ? 'var(--warn)' : 'var(--ctrl)');
}
function moveDots(base, paths, color, back, label) {
  const ov = document.getElementById('overlay');
  ov.innerHTML = base + paths.map((d, i) => `<path id="rp${i}" d="${d}" fill="none" stroke="${color}" stroke-width="6" stroke-opacity=".3" stroke-dasharray="6 5"/><circle id="dot${i}" r="8" fill="${color}" stroke="#fff" stroke-width="2"/>`).join('')
    + (label ? `<g id="dtag0">${tag(0, 0, label, color)}</g>` : '');
  const dtag0 = ov.querySelector('#dtag0');
  const items = paths.map((d, i) => ({p: ov.querySelector('#rp' + i), dot: ov.querySelector('#dot' + i)})).map(x => ({...x, len: x.p.getTotalLength()}));
  const t0 = performance.now(), dur = replay.stepMs * 0.6;
  const tick = now => {
    const t = Math.min(1, (now - t0) / dur), u = back ? 1 - t : t, ease = u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
    items.forEach((x, i) => { const pt = x.p.getPointAtLength(x.len * ease); x.dot.setAttribute('cx', pt.x); x.dot.setAttribute('cy', pt.y);
      if (i === 0 && dtag0) dtag0.setAttribute('transform', `translate(${pt.x},${pt.y - 20})`); });
    if (t < 1) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

// ------------------------------------------------------------------ 그림
function draw(s) {
  const meta = s.metadata, nodes = s.nodes, up = nodes.filter(n => n.reachable);
  const tr = visibleTrace(traceOf(s));
  const traffic = up.flatMap(n => (n.traffic || []).map(t => ({...t, broker: n.id})));
  const live = traffic.filter(t => t.agoMs < 4000);
  const reps = {};
  up.forEach(n => (n.replicas || []).forEach(r => { (reps[`${r.topic}-${r.partition}`] ||= {})[n.id] = r; }));
  const shown = [...new Set((s.producers || []).map(p => p.topic).filter(t => meta.topics[t]))];
  const topics = (shown.length ? shown : Object.keys(meta.topics).filter(t => !t.startsWith('__')).slice(0, 2)).map(t => meta.topics[t]);
  const ctrl = meta.controllerId;
  const coordOf = {}; // 그룹 → 코디네이터 브로커
  up.forEach(n => (n.groups || []).forEach(g => { coordOf[g.group] = n.id; }));
  let back = '', mid = '', front = '', tracePath = '', tags = ''; // tags = 선 위 이름표 (맨 위에 그린다)
  SEG = {};

  // ---- 가운데. ① 기본 흐름: 토픽의 파티션만 / ② 브로커·복제: 브로커 상자 안에 리더·팔로워 사본, 조정 서비스
  const full = VIEW === 'full';
  const PX = 600, PW = 340;
  const BOX = {}, ROW = {}; // ROW[`${파티션}|${리더}`] = 생산자·소비자 선이 닿는 높이
  let ZK = null, brokersH = 0;
  const rowL = (key, b) => [PX - PW / 2 + 10, ROW[`${key}|${b}`]];
  const rowR = (key, b) => [PX + PW / 2 - 10, ROW[`${key}|${b}`]];
  const head = b => BOX[b] ? BOX[b].y + 22 : null;
  // ① 은 브로커마다 자기가 리더인 파티션만, ② 는 리더·팔로워 사본 전부. 조정 서비스는 둘 다 보인다
  const HEADH = 34, RH = full ? 32 : 36, TOPH = topics.length > 1 ? 20 : 0; // 토픽이 하나면 토픽 이름 줄 생략
  ZK = {x: PX - PW / 2, y: 30, w: PW, h: 124};
  let y = ZK.y + ZK.h + 26;
  Object.keys(meta.brokers).map(Number).sort((a, b) => a - b).forEach(b => {
    const n = nodes.find(x => x.id === b) || {id: b};
    const r = n.reachable ? n.coord : null, info = meta.brokers[b] || {};
    const sections = topics.map(t => ({t, parts: t.partitions.filter(p => full ? p.replicas.includes(b) : p.leader === b)})).filter(x => x.parts.length);
    const h = HEADH + sections.reduce((a, x) => a + TOPH + x.parts.length * RH, 0) + 8;
    BOX[b] = {y, h};
    const flags = [];
    if (!n.reachable) flags.push(['응답 없음', 'var(--bad)']);
    else if (!r.session) flags.push(['세션 없음', 'var(--bad)']);
    else {
      if (r.isolated) flags.push(['🔌 고립', 'var(--bad)']);
      if (info.alive === false) flags.push(['죽음 표시', 'var(--bad)']);
      if (n.replicationDelayMs) flags.push([`🐢 ${n.replicationDelayMs / 1000}초`, 'var(--warn)']);
    }
    const coords = Object.entries(coordOf).filter(([, id]) => id === b).map(([g]) => g);
    mid += `<g opacity="${n.reachable && !(r && r.isolated) ? 1 : 0.45}">
      <rect x="${PX - PW / 2}" y="${y}" width="${PW}" height="${h}" rx="12" fill="var(--card)" stroke="${C(b)}" stroke-width="${b === ctrl ? 3 : 1.6}"/>
      <text x="${PX - PW / 2 + 14}" y="${y + 21}" font-weight="700" font-size="14">broker-${b}${b === ctrl ? ' 👑 컨트롤러' : ''}</text>
      <text x="${PX + PW / 2 - 12}" y="${y + 21}" text-anchor="end" font-size="11.5" fill="var(--muted)">${flags.map(([t, c]) => `<tspan fill="${c}" font-weight="700">${esc(t)} </tspan>`).join('')}${coords.length ? `<title>소비자 그룹 코디네이터: 합류·재조정·박동·오프셋 커밋을 받는다</title>🤝 코디네이터: ${coords.map(esc).join(', ')}` : ''}</text>`;
    let ry = y + HEADH;
    sections.forEach(({t, parts}) => {
      if (TOPH) mid += `<text x="${PX - PW / 2 + 14}" y="${ry + 14}" font-size="11" font-weight="700" fill="var(--muted)">${esc(t.name)}</text>`;
      ry += TOPH;
      parts.forEach(p => {
        const key = `${t.name}-${p.partition}`, cy = ry + RH / 2, col = partColor(t.name, p.partition);
        ROW[`${key}|${b}`] = cy;
        if (!full) { // ①: 리더 파티션 한 줄 (메시지 수만)
          const lead = (reps[key] || {})[b], n = lead ? lead.highWatermark : null;
          const traced = tr && tr.key === key, stored = traced && tr.has('stored');
          const x0 = PX - PW / 2 + 10, w = PW - 20;
          mid += `<rect x="${x0}" y="${cy - RH / 2 + 3}" width="${w}" height="${RH - 6}" rx="7" fill="${col}" fill-opacity=".12" stroke="${stored ? 'var(--data)' : col}" stroke-width="${stored ? 3 : 1.4}"/>
            <rect x="${x0}" y="${cy - RH / 2 + 3}" width="6" height="${RH - 6}" rx="3" fill="${col}"/>
            <text x="${x0 + 14}" y="${cy + 5}" font-size="13.5" font-weight="700">${key}</text>
            ${traced ? `<text x="${x0 + 86}" y="${cy + 5}" font-size="12" font-weight="700" fill="var(--data)">📨 offset ${tr.t.offset}</text>` : ''}
            <text x="${x0 + w - 10}" y="${cy + 5}" text-anchor="end" font-size="11.5" fill="var(--muted)">${n == null ? '응답 없음' : `${n}건`}</text>`;
          ry += RH;
          return;
        }
        const isLeader = p.leader === b, inIsr = p.isr.includes(b);
        const rep = (reps[key] || {})[b], lead = (reps[key] || {})[p.leader];
        const traced = tr && tr.key === key;
        const got = traced && (isLeader ? tr.has('stored') : tr.has('replicated', 'broker-' + b));
        const x0 = PX - PW / 2 + 10, w = PW - 20;
        const role = isLeader ? '★ 리더' : inIsr ? '팔로워' : '팔로워 · ISR 밖';
        const nums = !rep ? '' : isLeader ? `LEO ${rep.logEndOffset} · HW ${rep.highWatermark}`
          : `LEO ${rep.logEndOffset}${lead && lead.logEndOffset > rep.logEndOffset ? ` · ${lead.logEndOffset - rep.logEndOffset}건 뒤` : ''}`;
        mid += `<rect x="${x0}" y="${cy - RH / 2 + 3}" width="${w}" height="${RH - 6}" rx="6" fill="${col}" fill-opacity="${isLeader ? 0.16 : 0.04}"
            stroke="${got ? 'var(--data)' : col}" stroke-width="${got ? 3 : 1.3}" stroke-dasharray="${inIsr ? '' : '4 3'}"/>
          <rect x="${x0}" y="${cy - RH / 2 + 3}" width="6" height="${RH - 6}" rx="3" fill="${col}"/>
          <text x="${x0 + 14}" y="${cy + 4}" font-size="12.5" font-weight="700">${key}</text>
          <text x="${x0 + 74}" y="${cy + 4}" font-size="11.5" fill="${isLeader ? col : 'var(--muted)'}" font-weight="${isLeader ? 700 : 400}">${role}</text>
          <text x="${x0 + w - 10}" y="${cy + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${nums}</text>
          ${got ? `<circle cx="${x0 + w - 2}" cy="${cy - RH / 2 + 4}" r="7" fill="var(--data)"/><text x="${x0 + w - 2}" y="${cy - RH / 2 + 7.5}" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">✓</text>` : ''}
          ${traced && isLeader && tr.has('hw') ? `<text x="${x0 + 132}" y="${cy + 4}" font-size="11" font-weight="700" fill="var(--ctrl)">HW✓</text>` : ''}`;
        ry += RH;
      });
    });
    mid += `</g>`;
    y += h + 22;
  });
  brokersH = y;
  GEO = {PX, PW, BOX, ZK, ROUTE: {}};

  // ---- 조정 서비스 (ZooKeeper-lite) 상자와 브로커 세션 선
  const zk = s.zk || {};
  const zkNodes = {};
  (zk.nodes || []).forEach(x => { zkNodes[x.path] = x; });
  const zc = zkNodes['/controller'], zm = zkNodes['/metadata'];
  const regs = Object.keys(zkNodes).filter(p => p.startsWith('/brokers/')).map(p => p.slice(9)).sort();
  mid += `<g opacity="${zk.reachable === false ? 0.45 : 1}">
    <rect x="${ZK.x}" y="${ZK.y}" width="${ZK.w}" height="${ZK.h}" rx="12" fill="var(--card)" stroke="var(--ctrl)" stroke-width="2"/>
    <text x="${ZK.x + 14}" y="${ZK.y + 21}" font-weight="700" font-size="14">🗂 ZooKeeper-lite </text>
    <text x="${ZK.x + ZK.w - 12}" y="${ZK.y + 21}" text-anchor="end" font-size="11" fill="var(--muted)">${zk.reachable === false ? '<tspan fill="var(--bad)">응답 없음</tspan>' : `zxid ${zk.zxid ?? '?'}`}</text>
    <text x="${ZK.x + 14}" y="${ZK.y + 44}" font-size="12"><tspan font-weight="700">/controller</tspan> → ${zc ? `<tspan font-weight="700" fill="var(--accent)">broker-${esc(zc.data)}</tspan> <tspan fill="var(--muted)">epoch ${zc.czxid}</tspan>` : '<tspan fill="var(--warn)">비어 있음</tspan>'}</text>
    <text x="${ZK.x + 14}" y="${ZK.y + 64}" font-size="12"><tspan font-weight="700">/brokers</tspan> → ${regs.length ? regs.map(r => `broker-${r}`).join(' · ') : '없음'}</text>
    <text x="${ZK.x + 14}" y="${ZK.y + 84}" font-size="12"><tspan font-weight="700">/metadata</tspan> → 버전 ${zm ? zm.version : '?'}</text>
    <text x="${ZK.x + 14}" y="${ZK.y + 104}" font-size="12"><tspan font-weight="700">/offsets</tspan> → ${(() => {
      const by = {}; zkOffsets(s).forEach(o => { (by[o.group] ||= []).push(`${o.partition}:${o.offset}`); });
      // 그룹이 많으면 상자를 넘치므로 그룹 이름만 보이고, 파티션:오프셋 은 마우스를 올리면 보인다
      return Object.keys(by).length ? Object.entries(by).map(([g, v]) => `<tspan><title>${esc(g)}  파티션:오프셋  ${v.sort().join(' ')}</title>${esc(g)}</tspan>`).join(' · ') : '없음';
    })()}</text></g>`;
  // 컨트롤 선(청록)은 평소엔 그리지 않고, 일이 일어났을 때만 RECENT 동안 그린다
  const RECENT = 6000, now = Date.now();
  const zkRecent = (zk.events || []).filter(e => now - e.at < RECENT);
  const sessions = {};
  (zk.sessions || []).forEach(x => { sessions[x.name] = x; });
  Object.keys(BOX).map(Number).forEach(b => {
    const se = sessions['broker-' + b], ok = se && se.lastPingAgoMs < 1500;
    // 세션 선: 세션이 없을 때(빨강) 또는 그 브로커의 세션·임시 노드 이벤트가 방금 있었을 때만
    const sessionEv = e => e.who === 'broker-' + b && (e.kind.startsWith('session') || e.path === '/brokers/' + b);
    const offsetsEv = zkRecent.filter(e => e.who === 'broker-' + b && e.path.startsWith('/offsets/') && (e.kind === 'set' || e.kind === 'created'));
    if (offsetsEv.length) { // 코디네이터가 커밋된 오프셋을 조정 서비스 /offsets 에 쓴다
      const ox = ZK.x + ZK.w, oy = ZK.y + 104, bx = PX + PW / 2, by = head(b) + 8, ob = 25 + Math.abs(by - oy) / 14;
      const od = `M${bx},${by} C${bx + ob},${by} ${ox + ob},${oy} ${ox},${oy}`;
      tags += edgeTag(od, 'set /offsets', 'var(--ctrl)', 0.5);
      back += `<path d="${od}" fill="none" stroke="var(--ctrl)" stroke-width="1.6" stroke-dasharray="3 5" opacity=".85"><title>코디네이터 broker-${b} 가 커밋된 오프셋을 조정 서비스 /offsets 에 씀</title></path>`;
    }
    // 세션 선: 세션이 없을 때(빨강) 또는 그 브로커의 세션 시작·만료, /brokers/{id} 등록·삭제가 방금 있었을 때만
    if (se && !zkRecent.some(sessionEv)) return;
    const x1 = ZK.x + ZK.w, y1 = ZK.y + ZK.h / 2, x2 = PX + PW / 2, y2 = head(b), bulge = 40 + Math.abs(y2 - y1) / 12;
    const sd = `M${x1},${y1} C${x1 + bulge},${y1} ${x2 + bulge},${y2} ${x2},${y2}`;
    tags += edgeTag(sd, se ? '세션 시작 · /brokers 등록' : '세션 끊김', se ? 'var(--ctrl)' : 'var(--bad)', 0.6);
    back += `<path d="${sd}" fill="none" stroke="${se ? 'var(--ctrl)' : 'var(--bad)'}" stroke-width="1.5"
      stroke-dasharray="3 5" opacity="${se ? 0.7 : 0.5}" ${ok ? anim(2) : ''}><title>broker-${b} ↔ ZooKeeper-lite 세션 ${se ? `${se.id} (박동 ${(se.lastPingAgoMs / 1000).toFixed(1)}초 전)` : '없음'}</title></path>`;
  });

  // 컨트롤러가 /metadata 를 고침 → 조정 서비스가 감시 중인 브로커들에게 알림 → 브로커가 새 지도를 받아 둔다
  const metaSet = zkRecent.filter(e => e.kind === 'set' && e.path === '/metadata').sort((a, b) => b.at - a.at)[0];
  if (metaSet) {
    const w = Number((metaSet.who || '').replace('broker-', ''));
    Object.keys(BOX).map(Number).forEach(b => {
      const x1 = ZK.x + ZK.w, y1 = ZK.y + 84, x2 = PX + PW / 2, y2 = head(b), bulge = 60 + Math.abs(y2 - y1) / 10;
      const writer = b === w;
      const md = `M${x2},${y2} C${x2 + bulge},${y2} ${x1 + bulge},${y1} ${x1},${y1}`;
      tags += edgeTag(md, writer ? 'set /metadata' : '🔔 watch → get', 'var(--ctrl)', writer ? 0.5 : 0.25);
      back += `<path d="${md}" fill="none" stroke="var(--ctrl)" stroke-width="${writer ? 2.6 : 1.6}"
        stroke-dasharray="${writer ? '' : '3 5'}" opacity=".9"><title>${writer ? `📜 컨트롤러 broker-${b} 가 /metadata 를 고침` : `🔔 /metadata 감시 알림 → broker-${b} 가 새 지도를 받아 둠`}</title></path>`;
    });
    mid += `<text x="${ZK.x + 4}" y="${ZK.y + ZK.h + 17}" font-size="11" font-weight="700" fill="var(--ctrl)">📜 ${esc(metaSet.who)} 가 /metadata 고침 → 🔔 브로커들에 알림</text>`;
  }

  // 복제: 리더 줄 → 팔로워 줄 (데이터, 오른쪽). ② 에서만
  if (full) topics.forEach(t => t.partitions.forEach(p => {
    const key = `${t.name}-${p.partition}`, lead = (reps[key] || {})[p.leader];
    if (!lead || !ROW[`${key}|${p.leader}`]) return;
    p.replicas.forEach(f => {
      if (f === p.leader || !ROW[`${key}|${f}`]) return;
      const [x, y1] = rowR(key, p.leader), [, y2] = rowR(key, f);
      const st = (lead.followers || {})[f], lag = st ? lead.logEndOffset - st.logEnd : null;
      const fresh = st && st.lastFetchAgoMs < 1500;
      const col = !p.isr.includes(f) ? 'var(--bad)' : (!fresh || lag > 20) ? 'var(--warn)' : partColor(t.name, p.partition);
      const bulge = 22 + Math.abs(y2 - y1) / 9;
      const d = `M${x},${y1} C${x + bulge},${y1} ${x + bulge},${y2} ${x},${y2}`;
      if (tr && tr.key === key) SEG[`replicated|broker-${f}`] = d;
      const traced = tr && tr.key === key && tr.has('replicated', 'broker-' + f);
      const trouble = !p.isr.includes(f) || (lag !== null && lag > 20);
      if (!traced && !trouble) return; // 평소엔 숨긴다 (추적 중인 파티션, 뒤처진 사본만)
      tags += edgeTag(d, '팔로워 fetch', traced ? 'var(--data)' : col);
      back += `<path d="${d}" fill="none" stroke="${traced ? 'var(--data)' : col}" stroke-width="${traced ? 3 : 1.5}" stroke-dasharray="4 4" opacity="${traced ? 1 : 0.7}">
        <title>${key}: broker-${p.leader} → broker-${f} 복제 (팔로워가 가져감) ${st ? `· ${lag}건 뒤, ${(st.lastFetchAgoMs / 1000).toFixed(1)}초 전` : '· 아직 안 옴'}</title></path>`;
    });
  }));

  // ---- 왼쪽: 생산자 (🧺 버퍼 → 🧭 라우팅)
  const QX = 160, QW = 290, SLOT = 15;
  let qy = 30;
  (s.producers || []).forEach(pr => {
    const tm = meta.topics[pr.topic];
    const nparts = tm ? tm.partitions.length : 0, batch = pr.batchSize || 5;
    const bufH = 26 + nparts * 22, routH = 48;
    let h = 32 + bufH + 8 + routH + 10;
    const x0 = QX - QW / 2, bufY = qy + 32, routY = bufY + bufH + 8;
    const mineTopic = tr && tr.t && tr.t.topic === pr.topic;
    front += `<g opacity="${pr.reachable && pr.ready ? 1 : 0.5}">
      <rect x="${x0}" y="${qy}" width="${QW}" height="${h}" rx="12" fill="var(--card)" stroke="var(--data)" stroke-width="1.8"/>
      <text x="${x0 + 12}" y="${qy + 21}" font-weight="700" font-size="14">${esc(pr.name)}</text>
      <text x="${x0 + QW - 12}" y="${qy + 21}" text-anchor="end" font-size="11.5" fill="var(--muted)">→ ${esc(pr.topic)} · acks=${esc(pr.acks)}</text>
      <rect x="${x0 + 10}" y="${bufY}" width="${QW - 20}" height="${bufH}" rx="8" fill="var(--bg)" stroke="var(--line)"/>
      <text x="${x0 + 20}" y="${bufY + 17}" font-size="12" font-weight="700">🧺 버퍼 <tspan font-weight="400" font-size="10.5" fill="var(--muted)">hash(key) % ${nparts}</tspan></text>`;
    const buf = {};
    (pr.buffer || []).forEach(bb => { buf[bb.partition] = bb; });
    for (let p = 0; p < nparts; p++) {
      const ry = bufY + 25 + p * 22, bb = buf[p], keys = bb ? bb.keys : [];
      front += `<text x="${x0 + 22}" y="${ry + 12}" font-size="11" fill="${partColor(pr.topic, p)}" font-weight="700">p${p}</text>`;
      for (let i = 0; i < batch; i++) {
        const k = keys[i], cx = x0 + 46 + i * (SLOT + 4);
        const mine = k && k === currentTrace;
        front += `<rect x="${cx}" y="${ry}" width="${SLOT}" height="${SLOT}" rx="3" fill="${k ? (mine ? 'var(--data)' : partColor(pr.topic, p)) : 'none'}"
          stroke="${mine ? 'var(--data)' : partColor(pr.topic, p)}" stroke-width="${mine ? 2.5 : 1.2}">${k ? `<title>${esc(k)}</title>` : ''}</rect>`;
        if (mine) SEG.buffered = [cx + SLOT / 2, ry + SLOT / 2];
      }
      if (bb) {
        const when = pr.lingerMs > 0 ? ` · ${Math.max(0, (pr.lingerMs - bb.ageMs) / 1000).toFixed(1)}초` : '';
        front += `<text x="${x0 + 46 + batch * (SLOT + 4) + 6}" y="${ry + 12}" font-size="11" fill="var(--muted)">${keys.length}/${batch}${when}</text>`;
      }
    }
    if (!SEG.buffered && mineTopic) SEG.buffered = [x0 + 46 + 2 * (SLOT + 4), bufY + 25 + tr.t.partition * 22 + SLOT / 2];
    const leaders = pr.leaders || {};
    front += `<rect x="${x0 + 10}" y="${routY}" width="${QW - 20}" height="${routH}" rx="8" fill="var(--bg)" stroke="var(--line)"/>
      <text x="${x0 + 20}" y="${routY + 17}" font-size="12" font-weight="700">🧭 라우팅</text>
      <text x="${x0 + QW - 20}" y="${routY + 17}" text-anchor="end" font-size="10.5" fill="${pr.metadataVersion == null ? 'var(--muted)' : 'var(--ctrl)'}">${pr.metadataVersion == null ? '지도 없음' : `지도 v${pr.metadataVersion}`}</text>
      <text x="${x0 + 20}" y="${routY + 36}" font-size="11" fill="var(--muted)">${pr.metadataVersion == null ? '처음 보낼 때 받는다' : Object.entries(leaders).map(([p, l]) => `p${p}→b${l}`).join('  ')}</text></g>`;
    // 라우팅 → 각 파티션 리더 (데이터)
    const routeX = x0 + QW - 10, routeY = routY + routH / 2;
    let produceTagged = false;
    if (tm) tm.partitions.forEach(p => {
      const key = `${pr.topic}-${p.partition}`, lead = leaders[p.partition]; // 생산자가 들고 있는 지도의 리더 (없거나 낡았을 수 있다)
      if (lead == null || !ROW[`${key}|${lead}`]) return;
      const rate = live.filter(t => t.kind === 'produce' && t.client === pr.name && t.topic === pr.topic && t.partition === p.partition).reduce((a, t) => a + t.rate, 0);
      const d = curve(routeX, routeY, ...rowL(key, lead));
      if (tr && tr.key === key) SEG.dispatched = d;
      const traced = tr && tr.key === key && tr.has('dispatched');
      if ((traced || rate) && !produceTagged) { tags += edgeTag(d, 'POST /produce', 'var(--data)', 0.45); produceTagged = true; }
      back += `<path d="${d}" fill="none" stroke="${traced ? 'var(--data)' : partColor(pr.topic, p.partition)}" stroke-width="${traced ? 3.2 : width(rate)}"
        stroke-dasharray="8 6" opacity="${traced ? 1 : rate ? 0.85 : 0.3}" ${anim(rate)}><title>${pr.name} → ${key} 의 리더 broker-${lead} (생산자의 지도 기준)</title></path>`;
    });
    // 지도: 생산자는 조정 서비스·컨트롤러에 묻지 않는다. 부트스트랩 브로커 아무에게나 GET /metadata 를 하고
    // 그 브로커는 조정 서비스의 /metadata 를 감시해 들고 있던 사본을 돌려준다. 시작할 때와 리더가 아니라는 답(409)·연결 실패 때만
    GEO.ROUTE[pr.name] = [x0 + QW - 40, routY];
    if (mineTopic) SEG.map = [x0 + QW - 70, routY + 14]; // 한 건 추적의 🗺 단계 = 캐시한 지도를 본다 (요청 없음)
    const asked = traffic.filter(t => t.kind === 'metadata' && t.client === pr.name && t.agoMs < RECENT).sort((a, b) => a.agoMs - b.agoMs)[0];
    // 선출 재생 중엔 그 시점의 라우팅을 따로 그리므로 지금의 지도 요청은 숨긴다 (헷갈리지 않게)
    if (asked && BOX[asked.broker] && !(replay.on && replay.mode === 'election')) {
      const sx = x0 + QW - 40, sy = routY, bx = PX - PW / 2, by = head(asked.broker);
      // 요청은 생산자 → 브로커지만 실제로 흐르는 건 응답(지도): 선은 브로커 → 생산자 방향으로 흘러가게 그린다
      const gd = `M${bx},${by} C${bx - 70},${by} ${sx},${sy - 60} ${sx},${sy}`;
      tags += edgeTag(gd, 'GET /metadata ⇄ 지도', 'var(--ctrl)', 0.45);
      back += `<path d="${gd}" fill="none" stroke="var(--ctrl)" stroke-width="2.4" stroke-dasharray="3 5" ${anim(3)}>
        <title>${pr.name} → broker-${asked.broker}: GET /metadata (${(asked.agoMs / 1000).toFixed(1)}초 전)</title></path>`;
      const ly = qy + h + 6, lead = Object.entries(leaders).map(([p, l]) => `p${p}→b${l}`).join(' ');
      front += `<rect x="${x0 + 10}" y="${ly}" width="${QW - 20}" height="60" rx="8" fill="var(--card)" stroke="var(--ctrl)" stroke-width="1.6"/>
        <text x="${x0 + 20}" y="${ly + 17}" font-size="11.5" font-weight="700" fill="var(--ctrl)">🗺 broker-${asked.broker} 에 물어 받은 지도 <tspan font-weight="400" fill="var(--muted)">${(asked.agoMs / 1000).toFixed(1)}초 전</tspan></text>
        <text x="${x0 + 20}" y="${ly + 34}" font-size="11" font-family="ui-monospace,monospace">↩ ${esc(asked.detail || '')} · 컨트롤러 b${pr.controllerId ?? '?'} · ${esc(pr.topic)}</text>
        <text x="${x0 + 34}" y="${ly + 51}" font-size="11" font-family="ui-monospace,monospace">${lead}</text>`;
      h += 66;
    }
    qy += h + 24;
  });

  // ---- 오른쪽: 소비자 그룹
  const CXc = 1060, NW = 172, MH = 44, MG = 6, GHEAD = 26, GW = 188;
  const fetchRate = {};
  live.filter(t => t.kind === 'fetch').forEach(t => { fetchRate[`${t.client}|${t.topic}-${t.partition}`] = (fetchRate[`${t.client}|${t.topic}-${t.partition}`] || 0) + t.rate; });
  const lagOf = {};
  zkOffsets(s).forEach(o => {
    const l = (reps[`${o.topic}-${o.partition}`] || {})[(meta.topics[o.topic]?.partitions[o.partition] || {}).leader];
    if (l) lagOf[`${o.group}|${o.topic}-${o.partition}`] = Math.max(0, l.highWatermark - 1 - o.offset);
  });
  const STATE = {STABLE: ['안정', 'var(--ok)'], PREPARING_REBALANCE: ['⏳ 재조정 중', 'var(--warn)'], AWAITING_SYNC: ['⏳ 배정 대기', 'var(--warn)'], EMPTY: ['비었음', 'var(--muted)']};
  let gy = 30;
  up.flatMap(n => (n.groups || []).map(g => ({...g, coordinator: n.id})))
    .filter(g => topics.some(t => t.name === g.topic)).sort((a, b) => a.topic.localeCompare(b.topic))
    .forEach(g => {
      const x0 = CXc - GW / 2, [label, color] = STATE[g.state] || [g.state, 'var(--muted)'];
      const gh = GHEAD + g.members.length * (MH + MG) + 4;
      front += `<rect x="${x0}" y="${gy}" width="${GW}" height="${gh}" rx="12" fill="none" stroke="${color}" stroke-width="1.5" stroke-dasharray="${g.state === 'STABLE' ? '' : '6 4'}"/>
        <text x="${x0 + 10}" y="${gy + 17}" font-size="12" font-weight="700">${esc(g.group)} <tspan font-weight="400" fill="var(--muted)">← ${esc(g.topic)}</tspan></text>
        <text x="${x0 + GW - 10}" y="${gy + 17}" text-anchor="end" font-size="11" fill="${color}" font-weight="600"><title>세대(generation): 재조정이 끝날 때마다 1씩 오른다</title>세대 ${g.generation} · ${label}</text>`;
      // 그룹 → 코디네이터 브로커 (컨트롤)
      const committing = traffic.some(t => t.kind === 'commit' && t.detail === g.group && t.agoMs < RECENT);
      if (BOX[g.coordinator] && (g.state !== 'STABLE' || committing)) {
        const d = `M${x0},${gy + 12} C${x0 - 40},${gy + 12} ${PX + PW / 2 + 60},${head(g.coordinator)} ${PX + PW / 2},${head(g.coordinator)}`;
        tags += edgeTag(d, committing ? 'POST /offsets (커밋)' : 'join · sync (재조정)', 'var(--ctrl)', 0.3);
        back += `<path d="${d}" fill="none" stroke="var(--ctrl)" stroke-width="1.8" stroke-dasharray="2 5" opacity=".85"><title>${committing ? '📌 오프셋 커밋' : '⏳ 재조정'}: 그룹 ${g.group} 의 코디네이터 = broker-${g.coordinator} (박동·합류·오프셋 커밋)</title></path>`;
      }
      g.members.forEach((m, i) => {
        const my = gy + GHEAD + i * (MH + MG) + MH / 2, mx = CXc;
        const mlag = m.assigned.reduce((a, p) => a + (lagOf[`${g.group}|${g.topic}-${p}`] || 0), 0);
        const idle = !m.assigned.length, fetched = tr && tr.has('fetched', m.clientId);
        m.assigned.forEach(p => {
          const key = `${g.topic}-${p}`, pm = meta.topics[g.topic].partitions[p];
          if (!pm || !ROW[`${key}|${pm.leader}`]) return;
          const r = fetchRate[`${m.clientId}|${key}`] || 0;
          const d = curve(PX + PW / 2, ROW[`${key}|${pm.leader}`], mx - NW / 2, my);
          if (tr && tr.key === key) SEG[`fetched|${m.clientId}`] = curve(mx - NW / 2, my, PX + PW / 2, ROW[`${key}|${pm.leader}`]); // 소비자 → 리더 (요청 방향)
          const traced = tr && tr.key === key && fetched;
          if (traced || r) tags += edgeTag(d, 'GET /fetch ⇄ 메시지', traced ? 'var(--data)' : partColor(g.topic, p), 0.7);
          back += `<path d="${d}" fill="none" stroke="${traced ? 'var(--data)' : partColor(g.topic, p)}" stroke-width="${traced ? 3.2 : width(r)}" stroke-dasharray="8 6"
            opacity="${traced ? 1 : r ? 0.85 : 0.3}" ${anim(r)}><title>${key} 의 리더 broker-${pm.leader} → ${m.id}</title></path>`;
        });
        if (BOX[g.coordinator] && tr && tr.key && tr.key.startsWith(g.topic + '-') && m.assigned.includes(tr.t.partition)) {
          // 소비자 → 그룹 코디네이터 브로커 → 조정 서비스의 /offsets
          const hx = PX + PW / 2, hy = head(g.coordinator) + 6, zx = ZK.x + ZK.w, zy = ZK.y + 104;
          const d = `M${mx + NW / 2 - 8},${my - MH / 2} C${mx + NW / 2 + 20},${my - 60} ${hx + 90},${hy} ${hx},${hy} C${hx + 70},${hy} ${zx + 70},${zy} ${zx},${zy}`;
          SEG[`committed|group ${g.group}`] = d;
          if (tr.has('committed', 'group ' + g.group)) tracePath += `<path d="${d}" fill="none" stroke="var(--ctrl)" stroke-width="2.4" stroke-dasharray="3 5"><title>오프셋 커밋: 코디네이터 broker-${g.coordinator} 를 거쳐 ZooKeeper-lite /offsets 에 기록</title></path>`;
        }
        if (!idle) front += `<text x="${mx - NW / 2 - 4}" y="${my - 6}" text-anchor="end" font-size="10" font-weight="600" fill="var(--ctrl)"><title>풀 방식: 소비자가 리더에게 GET /fetch 로 요청하고, 리더는 메시지를 답으로 준다 (롱 폴링: 없으면 최대 1초 기다렸다 답함)</title>⇠ fetch</text>`;
        const tag = m.id.slice(m.id.lastIndexOf('#'));
        const sub = idle ? (g.state === 'STABLE' ? '놀고 있음' : '배정 대기') : `p${m.assigned.join(',')} · lag ${mlag}`;
        front += `<g opacity="${idle ? 0.5 : 1}">
          <rect x="${mx - NW / 2}" y="${my - MH / 2}" width="${NW}" height="${MH}" rx="9" fill="var(--card)"
            stroke="${fetched ? 'var(--data)' : 'var(--line)'}" stroke-width="${fetched ? 3.5 : m.id === g.leader ? 2.2 : 1.2}"/>
          <text x="${mx - NW / 2 + 10}" y="${my - 4}" font-weight="700" font-size="12.5">${esc(tag)}${m.id === g.leader ? ' <tspan font-size="11" fill="var(--accent)">리더</tspan>' : ''}${fetched ? ' 📥' : ''}</text>
          <text x="${mx - NW / 2 + 10}" y="${my + 13}" font-size="11" fill="var(--muted)">${esc(sub)}</text>
          <g data-group="${esc(g.group)}" data-member="${esc(m.id)}" data-cmd="crash" style="cursor:pointer"><title>멈춤: 15초 동안 박동도 소비도 멈춘다 (장애 흉내)</title>
            <rect x="${mx + NW / 2 - 52}" y="${my - 19}" width="22" height="18" rx="4" fill="var(--bg)" stroke="var(--line)"/><text x="${mx + NW / 2 - 41}" y="${my - 6}" text-anchor="middle" font-size="11">⏸</text></g>
          <g data-group="${esc(g.group)}" data-member="${esc(m.id)}" data-cmd="leave" style="cursor:pointer"><title>나가기: 그룹에 알리고 나간다, 10초 뒤 다시 합류</title>
            <rect x="${mx + NW / 2 - 27}" y="${my - 19}" width="22" height="18" rx="4" fill="var(--bg)" stroke="var(--line)"/><text x="${mx + NW / 2 - 16}" y="${my - 6}" text-anchor="middle" font-size="11">👋</text></g>
        </g>`;
      });
      gy += gh + 16;
    });

  // ---- 재생용 점 위치 (리더 줄)
  if (tr && tr.t) {
    const pm = (meta.topics[tr.t.topic] || {partitions: []}).partitions[tr.t.partition];
    if (pm && ROW[`${tr.key}|${pm.leader}`]) {
      SEG.stored = [PX + PW / 2 - 30, ROW[`${tr.key}|${pm.leader}`]];
      SEG.hw = full ? [PX - PW / 2 + 152, ROW[`${tr.key}|${pm.leader}`]] : null; // ① 에선 복제·HW 를 그리지 않는다 (자막·타임라인으로만)
    }
  }

  const heads = `<text x="${QX}" y="18" text-anchor="middle" font-size="12" fill="var(--muted)">생산자</text>
    <text x="${PX}" y="18" text-anchor="middle" font-size="12" fill="var(--muted)">브로커 · 조정 서비스</text>
    <text x="${CXc}" y="18" text-anchor="middle" font-size="12" fill="var(--muted)">소비자 그룹</text>`;
  const fullH = Math.max(brokersH, qy, gy) + 10;
  const el = document.getElementById('flow');
  el.setAttribute('viewBox', `0 0 1160 ${fullH}`);
  document.getElementById('overlay').setAttribute('viewBox', `0 0 1160 ${fullH}`);
  el.innerHTML = back + mid + front + tracePath + tags + heads;
}

// ------------------------------------------------------------------ 표·타임라인
function traceView(s, tr) {
  const body = document.getElementById('trace');
  if (replay.on && replay.mode === 'election') {
    const list = replay.steps, t0 = list.length ? list[0].at : 0, E = replay.election.E;
    document.getElementById('trTitle').textContent = `👑 컨트롤러 선출: broker-${E.node} 가 /controller 를 차지 (zxid ${E.term})`;
    body.innerHTML = list.map((e, i) => {
      const cls = i >= replay.k ? 'future' : i === replay.k - 1 ? 'cur' : '';
      return `<tr class="${cls}"><td>+${e.at - t0}ms</td><td>${kindTag('ctrl')}${ZK_ICON[e.kind] || '•'} ${esc(e.text)}${e.data ? ` <code>${esc(e.data)}</code>` : ''}</td></tr>`;
    }).join('');
    return;
  }
  if (!tr) return;
  document.getElementById('trTitle').textContent = tr.t ? `${tr.id} · ${tr.t.topic}-${tr.t.partition} offset ${tr.t.offset}` : tr.id;
  const all = tr.all, t0 = all.length ? all[0].at : 0;
  let rows = all.map((e, i) => {
    const k = STEP_KIND[e.step] || 'ctrl';
    const cls = !replay.on ? '' : i >= replay.k ? 'future' : i === replay.k - 1 ? 'cur' : '';
    const where = e.broker > 0 ? `<span class="dot" style="background:${C(e.broker)}" title="broker-${e.broker} 에서 기록"></span>` : `<span class="dot" style="background:var(--data)" title="생산자에서 기록"></span>`;
    return `<tr class="${cls}"><td>+${e.at - t0}ms</td><td>${kindTag(k)}${STEP_ICON[e.step] || '•'} ${where} ${esc(e.text)}</td></tr>`;
  }).join('');
  if (!replay.on && !tr.done) {
    const last = all.at(-1);
    rows += `<tr class="wait"><td>…</td><td>${last && last.step === 'buffered' ? '생산자 버퍼에서 기다리는 중 (묶음이 5건 차면 보냄, 또는 "지금 보내기")' : '다음 단계를 기다리는 중'}</td></tr>`;
  }
  body.innerHTML = rows || '<tr class="wait"><td></td><td>기록을 모으는 중…</td></tr>';
}

/** 조정 서비스(상태 저장소)의 오프셋 노드: /offsets/{그룹}/{토픽}/{파티션} = 오프셋. */
function zkOffsets(s) {
  return ((s.zk || {}).nodes || []).map(n => /^\/offsets\/([^/]+)\/([^/]+)\/(\d+)$/.exec(n.path) && {n, m: /^\/offsets\/([^/]+)\/([^/]+)\/(\d+)$/.exec(n.path)})
    .filter(Boolean).map(({n, m}) => ({group: m[1], topic: m[2], partition: Number(m[3]), offset: Number(n.data)}));
}

function tables(s) {
  const meta = s.metadata, up = s.nodes.filter(n => n.reachable);
  const reps = {};
  up.forEach(n => (n.replicas || []).forEach(r => { (reps[`${r.topic}-${r.partition}`] ||= {})[n.id] = r; }));
  const rows = [];
  Object.values(meta.topics).sort((a, b) => a.name.localeCompare(b.name)).forEach(t => t.partitions.forEach(p => {
    const l = (reps[`${t.name}-${p.partition}`] || {})[p.leader];
    rows.push(`<tr><td>${esc(t.name)}-${p.partition}</td><td>${p.leader < 0 ? '<span class="bad">없음</span>' : 'broker-' + p.leader}</td>
      <td>${p.isr.join(', ')}</td><td class="num">${l ? l.logEndOffset : '-'}</td><td class="num">${l ? l.highWatermark : '-'}</td></tr>`);
  }));
  document.getElementById('ptable').innerHTML = rows.join('');
  const groups = {};
  zkOffsets(s).forEach(o => {
    const g = (groups[`${o.group}|${o.topic}`] ||= {group: o.group, topic: o.topic, parts: {}});
    const l = (reps[`${o.topic}-${o.partition}`] || {})[(meta.topics[o.topic]?.partitions[o.partition] || {}).leader];
    g.parts[o.partition] = l ? Math.max(0, l.highWatermark - 1 - o.offset) : null;
  });
  document.getElementById('gtable').innerHTML = Object.values(groups).map(g => {
    const e = Object.entries(g.parts).sort((a, b) => a[0] - b[0]);
    return `<tr><td>${esc(g.group)}</td><td>${esc(g.topic)}</td><td class="num">${e.reduce((a, [, v]) => a + (v || 0), 0)}</td>
      <td class="muted">${e.map(([p, v]) => `${p}:${v ?? '?'}`).join(' ')}</td></tr>`;
  }).join('');
  // 브로커 기록 + 조정 서비스 기록 (조정 서비스는 node 0, 회색)
  const zkEv = ((s.zk || {}).events || []).filter(e => e.kind !== 'notify').map(e => ({...e, node: 0, text: '🗂 ' + e.text}));
  const events = up.flatMap(n => n.coord.events.filter(e => e.kind !== 'metadata_applied')).concat(zkEv)
    .sort((a, b) => b.at - a.at || (a.node === b.node ? b.seq - a.seq : a.node - b.node)).slice(0, 18);
  document.getElementById('events').innerHTML = events.map(e =>
    `<tr><td>${time(e.at)}</td><td><span class="dot" style="background:${C(e.node)}"></span> ${esc(e.text)}</td></tr>`).join('');
}

async function refresh() {
  let s;
  try { s = await (await fetch('/admin/cluster')).json(); }
  catch (e) { document.getElementById('updated').textContent = '연결 안 됨 — 8081~8083 중 다른 포트로'; return; }
  lastState = s;
  tools(s.nodes);
  sendbar(s);
  draw(s);
  tables(s);
  traceView(s, traceOf(s));
  document.getElementById('updated').textContent = time(Date.now());
}
document.getElementById('flow').addEventListener('click', async (e) => {
  const b = e.target.closest('[data-cmd]');
  if (!b) return;
  const q = new URLSearchParams({group: b.dataset.group, member: b.dataset.member, cmd: b.dataset.cmd});
  await fetch('/admin/cluster/group-command?' + q, {method: 'POST'}).catch(() => {});
});
const qv = new URLSearchParams(location.search).get('view'); // ?view=simple | full
setView(qv === 'full' || qv === 'simple' ? qv : VIEW);
refresh().then(() => { // ?trace=…&replay=1 (한 건) 또는 ?replay=election (최근 선거)
  const r = new URLSearchParams(location.search).get('replay');
  if (r === 'election') startReplay('election'); else if (r) startReplay('trace');
});
setInterval(refresh, 1000);
</script>
