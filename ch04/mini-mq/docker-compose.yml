# 3단계: 브로커 3대 (Raft-lite 컨트롤러 + 파티션마다 사본 3개)
#   producer-logs   → logs   (ACK=1,   최소 ISR 1) → 소비자 그룹 search  × 3
#   producer-orders → orders (ACK=all, 최소 ISR 2) → 소비자 그룹 payment × 4 (1명 놀기)
#   생산자는 대시보드 버튼을 누를 때만 보낸다
#   대시보드  http://localhost:8081  (8082, 8083 도 같은 화면)
name: mini-mq

x-broker: &broker
  build: { context: ., dockerfile: docker/Dockerfile, args: { MODULE: broker } }
  image: mini-mq-broker
  restart: unless-stopped

x-broker-env: &broker-env
  MINIMQ_PEERS: "1=http://broker-1:8080,2=http://broker-2:8080,3=http://broker-3:8080"
  MINIMQ_DATA_DIR: /data
  MINIMQ_SEGMENT_BYTES: "262144"   # 256KB 마다 새 세그먼트 (금방 쌓이는 걸 보려고)
  MINIMQ_RETENTION_MS: "300000"    # 보관 5분 (교재는 2주)
  MINIMQ_ELECTION_MIN_MS: "1500"   # 선거 타임아웃 1.5~3초 (눈으로 보려고 넉넉히)
  MINIMQ_ELECTION_MAX_MS: "3000"
  MINIMQ_HEARTBEAT_MS: "500"
  MINIMQ_BROKER_DEAD_MS: "3000"
  MINIMQ_PRODUCERS: "producer-logs=http://producer-logs:8080,producer-orders=http://producer-orders:8080"
  LOGGING_LEVEL_RAFT_RPC: ${RAFT_RPC_LOG:-INFO}   # RAFT_RPC_LOG=DEBUG ./run.sh 로 박동 송수신을 본다
  MINIMQ_REPLICA_LAG_TIME_MS: "4000"        # 4초 동안 안 가져가면 ISR 에서 뺀다
  MINIMQ_REPLICA_LAG_MAX_MESSAGES: "1000"   # 1000건 넘게 뒤처져도 뺀다

x-demo: &demo
  build: { context: ., dockerfile: docker/Dockerfile, args: { MODULE: demo } }
  image: mini-mq-demo
  restart: unless-stopped
  depends_on: [broker-1, broker-2, broker-3]
  environment: &demo-env
    JAVA_TOOL_OPTIONS: "-Xmx128m -XX:+UseSerialGC -XX:TieredStopAtLevel=1"   # 소비자를 여럿 띄우므로 가볍게

x-bootstrap: &bootstrap "http://broker-1:8080,http://broker-2:8080,http://broker-3:8080"

services:
  broker-1:
    <<: *broker
    environment: { <<: *broker-env, MINIMQ_BROKER_ID: "1" }
    ports: ["8081:8080"]
    volumes: [broker-1:/data]
  broker-2:
    <<: *broker
    environment: { <<: *broker-env, MINIMQ_BROKER_ID: "2" }
    ports: ["8082:8080"]
    volumes: [broker-2:/data]
  broker-3:
    <<: *broker
    environment: { <<: *broker-env, MINIMQ_BROKER_ID: "3" }
    ports: ["8083:8080"]
    volumes: [broker-3:/data]

  # 생산자 2개 = 토픽 2개. 자동으로 보내지 않고 대시보드 버튼을 받을 때만 보낸다.
  # 버퍼: 파티션별 묶음이 5건이 차면 리더에게 한 번에 보낸다 (시간으로는 안 보냄. 덜 찬 묶음은 대시보드 "지금 보내기")
  producer-logs:
    <<: *demo
    environment:
      <<: *demo-env
      SPRING_MAIN_WEB_APPLICATION_TYPE: servlet
      DEMO_ROLE: producer
      DEMO_BOOTSTRAP: *bootstrap
      DEMO_NAME: logs
      DEMO_TOPIC: logs
      DEMO_TOPIC_PARTITIONS: "3"
      DEMO_ACKS: "1"
      DEMO_MIN_INSYNC_REPLICAS: "1"
      DEMO_BATCH_SIZE: "5"
      DEMO_LINGER_MS: "0"

  producer-orders:
    <<: *demo
    environment:
      <<: *demo-env
      SPRING_MAIN_WEB_APPLICATION_TYPE: servlet
      DEMO_ROLE: producer
      DEMO_BOOTSTRAP: *bootstrap
      DEMO_NAME: orders
      DEMO_TOPIC: orders
      DEMO_TOPIC_PARTITIONS: "3"
      DEMO_ACKS: all
      DEMO_MIN_INSYNC_REPLICAS: "2"
      DEMO_BATCH_SIZE: "5"
      DEMO_LINGER_MS: "0"

  # 소비자 그룹 search 3명 → logs 파티션 3개를 1개씩
  # 처리 후 커밋(최소 한 번). gap 이 생기면 = ACK 를 받았는데 사라진 메시지
  # 늘리고 줄이기: docker compose up -d --scale consumer-logs=4
  consumer-logs:
    <<: *demo
    deploy: { replicas: 3 }
    environment:
      <<: *demo-env
      DEMO_ROLE: consumer
      DEMO_BOOTSTRAP: *bootstrap
      DEMO_TOPIC: logs
      DEMO_GROUP: search
      DEMO_COMMIT_MODE: after

  # payment 그룹에 4명인데 파티션은 3개 → 1명은 논다 (교재 그림 4.7)
  consumer-orders:
    <<: *demo
    deploy: { replicas: 4 }
    environment:
      <<: *demo-env
      DEMO_ROLE: consumer
      DEMO_BOOTSTRAP: *bootstrap
      DEMO_TOPIC: orders
      DEMO_GROUP: payment
      DEMO_COMMIT_MODE: after

  # 1단계 실험(처리 도중 죽음 → 최대 한 번이면 gap, 최소 한 번이면 dup)을 다시 보려면
  # 소비자에 DEMO_CRASH_EVERY_SEC: "20" 을, 최대 한 번은 DEMO_COMMIT_MODE: before 를 넣는다

volumes:
  broker-1:
  broker-2:
  broker-3:
