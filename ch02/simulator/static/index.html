<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>근접 친구 시뮬레이터</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="title">
      <span class="dot"></span>
      <h1>근접 친구 시뮬레이터</h1>
      <span class="sub">대규모 시스템 설계 기초 2 · 2장 Nearby Friends — Redis Pub/Sub · Redis Cache · HTTP · SSE</span>
    </div>
    <div class="controls">
      <label class="toggle"><input type="checkbox" id="walk" /> <span>다른 친구 랜덤 이동</span></label>
      <button id="reset" class="btn">위치 초기화</button>
    </div>
  </header>

  <main class="layout">
    <section class="map-wrap">
      <svg id="map" preserveAspectRatio="xMidYMid meet"></svg>
      <div class="legend">
        <span><i class="lg sel"></i>선택한 사용자</span>
        <span><i class="lg near"></i>근처 친구 (SSE 수신)</span>
        <span><i class="lg far"></i>그 외 친구</span>
      </div>
      <div class="hint">아이콘을 <b>클릭</b>해 사용자 선택 · <b>드래그</b>해서 이동 (다른 친구도 드래그 가능)</div>
    </section>

    <aside class="panel">
      <div class="card me">
        <div class="me-row">
          <div class="avatar" id="meAvatar">?</div>
          <div class="me-info">
            <div class="me-name" id="meName">사용자 선택 전</div>
            <div class="me-pos" id="mePos">-</div>
          </div>
          <span class="badge" id="conn">미연결</span>
        </div>
        <div class="radius">
          <label for="radius">근접 반경</label>
          <input type="range" id="radius" min="200" max="1500" step="50" />
          <span id="radiusVal">500m</span>
        </div>
      </div>

      <div class="card">
        <div class="card-h">
          <h2>근처 친구 <span class="count" id="nearCount">0</span></h2>
          <span class="muted">SSE로 받은 목록</span>
        </div>
        <ul class="friends" id="friends"><li class="empty">근처에 친구가 없습니다</li></ul>
      </div>

      <div class="card">
        <div class="card-h"><h2>SSE 핸들러 상태</h2><span class="muted">서버 메모리</span></div>
        <div class="stats">
          <div><b id="stCached">0</b><span>메모리의 친구 위치</span></div>
          <div><b id="stRecv">0</b><span>Pub/Sub 수신</span></div>
          <div><b id="stFwd">0</b><span>SSE 전달</span></div>
          <div><b id="stDrop">0</b><span>반경 밖 필터링</span></div>
        </div>
      </div>

      <div class="card log-card">
        <div class="card-h"><h2>이벤트 로그</h2><button class="link" id="clearLog">지우기</button></div>
        <ol class="log" id="log"></ol>
      </div>
    </aside>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
